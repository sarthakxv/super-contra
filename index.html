<style>
  :root { --bg: #000; --fg: #ddd; --dim: #777; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000;
    outline: none; }
  #help { color: var(--dim); text-align: center; max-width: 900px; padding: 0 16px; }
  #help b { color: var(--fg); font-weight: normal; }

  /* CRT power-on. crt-boot: a dot stretches into a glowing line and hums while assets load.
     crt-on (set by main.js after the first frame): the beam opens to the full picture and flickers. */
  #crt { position: relative; }
  #crt::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .crt-boot #crt { animation: crt-line 140ms ease-out forwards; }
  .crt-boot #crt::after { opacity: 1; animation: crt-hum 160ms 140ms infinite; }
  .crt-on #crt { animation: crt-open 320ms ease-out; }
  .crt-on #crt::after { animation: crt-flash 320ms linear; }
  .crt-boot #help { opacity: 0; }
  #help { transition: opacity 180ms 160ms; }
  @keyframes crt-line {
    0%   { transform: scale(0, 0.005); }
    40%  { transform: scale(0.02, 0.005); }
    100% { transform: scale(1, 0.005); }
  }
  @keyframes crt-hum { 50% { opacity: 0.75; } }
  @keyframes crt-open {
    0%   { transform: scale(1, 0.005); }
    35%  { transform: none; filter: brightness(1.8); }
    50%  { filter: brightness(0.5); }
    62%  { filter: brightness(1.5); }
    75%  { filter: brightness(0.75); }
    88%  { filter: brightness(1.15); }
  }
  @keyframes crt-flash { 0%, 15% { opacity: 1; } 45%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #crt, #crt::after { animation: none !important; }
    .crt-boot #crt::after { opacity: 0; }
  }
</style>
</head>
<body class="crt-boot">
<div id="crt"><canvas id="screen" width="256" height="192" tabindex="0"></canvas></div>
<script>
  // Same integer scale as render.js fit(), applied before the modules load so the CRT line doesn't resize mid-warm-up.
  (function (c) {
    var s = Math.max(1, Math.floor(Math.min(innerWidth / 256, (innerHeight - 60) / 192)));
    c.style.width = 256 * s + "px";
    c.style.height = 192 * s + "px";
  })(document.getElementById("screen"));
</script>
<div id="help">
  <b>P1</b> arrows · <b>Z</b> fire · <b>X</b> jump &nbsp;|&nbsp;
  <b>P2</b> WASD · <b>F</b> fire · <b>G</b> jump &nbsp;|&nbsp;
  gamepads supported · <b>Enter/Esc</b> start/pause · <b>F2</b> colliders · <b>M</b> mute
</div>
<script type="module" src="src/main.js"></script>
</body>

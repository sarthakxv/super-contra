<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contra — Stage 1</title>
<style>
  :root { --bg: #000; --fg: #ddd; --dim: #777; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000;
    outline: none; }
  #help { color: var(--dim); text-align: center; max-width: 900px; padding: 0 16px; }
  #help b { color: var(--fg); font-weight: normal; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="192" tabindex="0"></canvas>
<div id="help">
  <b>P1</b> arrows · <b>Z</b> fire · <b>X</b> jump &nbsp;|&nbsp;
  <b>P2</b> WASD · <b>F</b> fire · <b>G</b> jump &nbsp;|&nbsp;
  gamepads supported · <b>Enter/Esc</b> start/pause · <b>F2</b> colliders · <b>M</b> mute
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
